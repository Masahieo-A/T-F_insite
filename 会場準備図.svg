<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">校内陸上競技大会 会場準備図</title>
  <desc id="desc">250mトラック、斜め100m・110mハードル直線、高跳び、砲丸投、走幅跳砂場、女子更衣室の配置図。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#047857"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <style>
      .bg { fill: #f5f7ef; }
      .field { fill: #dff0d5; stroke: #78a36b; stroke-width: 3; }
      .track { fill: none; stroke: #4b5563; stroke-width: 8; }
      .track-inner { fill: none; stroke: #9ca3af; stroke-width: 3; stroke-dasharray: 14 10; }
      .straight-main { stroke: #1d4ed8; stroke-width: 8; stroke-linecap: round; }
      .straight-lane { stroke: #60a5fa; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 12 10; }
      .runout { stroke: #1d4ed8; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 18 12; }
      .safe { fill: #fee2e2; stroke: #b91c1c; stroke-width: 3; stroke-dasharray: 12 8; opacity: .85; }
      .box { fill: #fff; stroke: #111827; stroke-width: 4; filter: url(#softShadow); }
      .label { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; fill: #111827; font-size: 28px; font-weight: 700; }
      .small { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; fill: #111827; font-size: 20px; font-weight: 600; }
      .note { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; fill: #374151; font-size: 18px; }
      .white { fill: #fff; }
      .blue { fill: #1d4ed8; }
      .red { fill: #b91c1c; }
      .green { fill: #047857; }
      .cone { fill: #f97316; stroke: #9a3412; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <rect class="field" x="45" y="80" width="1510" height="850" rx="20"/>

  <text class="label" x="70" y="54">校内陸上競技大会　会場準備図</text>
  <text class="note" x="70" y="84">縮尺は概略。現地で実測済みの「斜め直線」を優先して設営する。</text>

  <!-- 250m track -->
  <ellipse class="track" cx="880" cy="520" rx="520" ry="250"/>
  <ellipse class="track-inner" cx="880" cy="520" rx="455" ry="188"/>
  <path d="M1230 740 C1320 690 1375 620 1390 545" fill="none" stroke="#047857" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <text class="label" x="1365" y="520">250m</text>
  <text class="label" x="1365" y="558">トラック</text>
  <text class="note" x="1050" y="772">周回方向</text>

  <!-- Diagonal 100/110 straight -->
  <line class="straight-lane" x1="320" y1="815" x2="1300" y2="130"/>
  <line class="straight-main" x1="345" y1="845" x2="1335" y2="155" marker-end="url(#arrowBlue)"/>
  <line class="straight-lane" x1="385" y1="880" x2="1375" y2="190"/>
  <line class="runout" x1="1335" y1="155" x2="1455" y2="70" marker-end="url(#arrowBlue)"/>
  <rect class="box" x="1180" y="42" width="320" height="98" rx="10"/>
  <text class="label blue" x="1200" y="82">100m / 110mH</text>
  <text class="small" x="1200" y="116">斜め直線＋流し確保</text>
  <text class="small blue" x="310" y="800">START</text>
  <text class="small blue" x="1348" y="154">FINISH</text>
  <text class="note" x="1085" y="202">流し・減速区間</text>

  <!-- Girls changing room -->
  <rect class="box" x="105" y="520" width="120" height="300" rx="4"/>
  <text class="label" transform="translate(158 585) rotate(90)">女子更衣室</text>

  <!-- Long jump pit -->
  <rect class="box" x="320" y="855" width="210" height="80" rx="4"/>
  <text class="label" x="350" y="907">砂場</text>
  <path d="M540 850 C640 830 720 818 820 812" fill="none" stroke="#92400e" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <text class="small" x="560" y="880">走幅跳 助走方向</text>

  <!-- High jump area -->
  <rect class="box" x="840" y="665" width="230" height="95" rx="8"/>
  <line x1="870" y1="662" x2="1040" y2="662" stroke="#111827" stroke-width="5"/>
  <text class="label" x="887" y="725">高跳び</text>
  <path d="M780 820 C830 770 865 748 910 730" fill="none" stroke="#047857" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <text class="note" x="700" y="845">助走方向</text>

  <!-- Shot put area and safety sector -->
  <path class="safe" d="M1180 560 L1480 375 L1515 720 Z"/>
  <rect class="box" x="1165" y="520" width="210" height="240" rx="8"/>
  <circle cx="1215" cy="700" r="24" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
  <path d="M1215 700 C1300 620 1385 525 1475 410" fill="none" stroke="#b91c1c" stroke-width="8" marker-end="url(#arrowRed)"/>
  <text class="label" x="1212" y="620">砲丸投</text>
  <text class="small red" x="1260" y="668">投てき方向</text>
  <text class="note red" x="1168" y="790">※高跳び側へ投げない</text>
  <text class="note red" x="1168" y="815">※セクター内のみ試技</text>

  <!-- Safety buffer -->
  <line x1="1115" y1="520" x2="1115" y2="790" stroke="#b91c1c" stroke-width="5" stroke-dasharray="14 10"/>
  <text class="small red" x="900" y="520">安全ライン</text>
  <text class="note" x="900" y="548">砲丸は高跳び側へ入れない</text>

  <!-- Setup cones / points -->
  <polygon class="cone" points="330,845 350,845 340,808"/>
  <polygon class="cone" points="1330,155 1350,155 1340,118"/>
  <polygon class="cone" points="1215,700 1235,700 1225,663"/>
  <polygon class="cone" points="900,665 920,665 910,628"/>
  <text class="note" x="70" y="935">準備物: コーン、メジャー、ハードル、砂場整備具、高跳びマット。</text>
  <text class="note" x="70" y="962">確認: 斜め直線の100m・110mH、砲丸セクター、安全確認ラインを先に設営する。</text>
</svg>
